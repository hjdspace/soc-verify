name: Release Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            package_script: package:win
            runner_output: resources/binaries/socverify-runner.exe
            runner_asset: socverify-runner-windows-x64.exe
          - name: Linux
            os: ubuntu-latest
            package_script: package:linux
            runner_output: resources/binaries/socverify-runner
            runner_asset: socverify-runner-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install app dependencies
        run: npm ci

      - name: Install engine dependencies
        run: bun install --frozen-lockfile
        working-directory: engine/oh-my-pi

      - name: Read omp version
        id: omp-version
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./engine/oh-my-pi/packages/natives/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Cache the pi_natives .node files — they only change when the omp
      # engine version changes, so this avoids re-downloading the 150MB omp
      # binary on every CI run.
      - name: Cache pi_natives addon
        id: natives-cache
        uses: actions/cache@v4
        with:
          path: resources/binaries/pi_natives.*.node
          key: pi-natives-${{ matrix.name }}-${{ steps.omp-version.outputs.version }}

      # build:runner compiles the runner binary AND runs download-natives.
      # When the cache is hit, download-natives detects the .node files
      # already exist and skips instantly.
      - name: Build agent runner + native addon
        run: npm run build:runner

      - name: Package desktop app
        run: npm run ${{ matrix.package_script }}
        env:
          # Use 'never' so electron-builder does NOT publish directly to GitHub
          # (which would fail on 503 with no retry). Instead, we upload the
          # built artifacts via gh CLI with retry in the upload-installer step.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: never

      - name: Upload runner binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.os }}
          path: ${{ matrix.runner_output }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn

  upload-installer-assets:
    name: Upload installer binaries
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installer-artifacts
          merge-multiple: true

      - name: Create draft release (if not exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Retry wrapper for GitHub API 5xx errors
          gh_retry() {
            local max_retries=5
            local delay=30
            local attempt=1
            while [ "$attempt" -le "$max_retries" ]; do
              if "$@"; then
                return 0
              fi
              local rc=$?
              if [ "$attempt" -eq "$max_retries" ]; then
                echo "::error::Command failed after $max_retries attempts: $*"
                return $rc
              fi
              echo "::warning::Attempt $attempt/$max_retries failed (exit $rc), retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          if ! gh_retry gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh_retry gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes ""
            echo "Created draft release ${GITHUB_REF_NAME}"
          else
            echo "Release ${GITHUB_REF_NAME} already exists, skipping creation"
          fi

      - name: Upload installer binaries to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Retry wrapper for GitHub API 5xx errors
          gh_retry() {
            local max_retries=5
            local delay=30
            local attempt=1
            while [ "$attempt" -le "$max_retries" ]; do
              if "$@"; then
                return 0
              fi
              local rc=$?
              if [ "$attempt" -eq "$max_retries" ]; then
                echo "::error::Command failed after $max_retries attempts: $*"
                return $rc
              fi
              echo "::warning::Attempt $attempt/$max_retries failed (exit $rc), retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          for f in installer-artifacts/*; do
            [ -e "$f" ] || continue
            gh_retry gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
          done

  upload-runner-assets:
    name: Upload runner binaries
    needs: [build, upload-installer-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download runner artifacts
        uses: actions/download-artifact@v4
        with:
          path: runner-artifacts
          merge-multiple: true

      - name: Wait for draft release (created by upload-installer-assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Retry wrapper for GitHub API 5xx errors
          gh_retry() {
            local max_retries=5
            local delay=30
            local attempt=1
            while [ "$attempt" -le "$max_retries" ]; do
              if "$@"; then
                return 0
              fi
              local rc=$?
              if [ "$attempt" -eq "$max_retries" ]; then
                echo "::error::Command failed after $max_retries attempts: $*"
                return $rc
              fi
              echo "::warning::Attempt $attempt/$max_retries failed (exit $rc), retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          # Wait for the draft release to be created by upload-installer-assets job.
          # Polls every 15s up to 10 minutes.
          for i in $(seq 1 40); do
            if gh_retry gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
              echo "Release ${GITHUB_REF_NAME} is ready."
              exit 0
            fi
            echo "Waiting for release ${GITHUB_REF_NAME} to be created... (attempt $i/40)"
            sleep 15
          done
          echo "::error::Timed out waiting for release ${GITHUB_REF_NAME}"
          exit 1

      - name: Upload runner binaries to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Retry wrapper for GitHub API 5xx errors
          gh_retry() {
            local max_retries=5
            local delay=30
            local attempt=1
            while [ "$attempt" -le "$max_retries" ]; do
              if "$@"; then
                return 0
              fi
              local rc=$?
              if [ "$attempt" -eq "$max_retries" ]; then
                echo "::error::Command failed after $max_retries attempts: $*"
                return $rc
              fi
              echo "::warning::Attempt $attempt/$max_retries failed (exit $rc), retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          for f in runner-artifacts/*; do
            [ -e "$f" ] || continue
            gh_retry gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
          done

  publish-release:
    name: Publish GitHub Release
    needs: [build, upload-runner-assets, upload-installer-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Load release notes
        id: release_notes
        shell: bash
        run: |
          NOTES_FILE="release-notes/v${{ steps.version.outputs.value }}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::warning::Missing release notes file: $NOTES_FILE, using empty notes"
            echo "body=_" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'body<<__RELEASE_NOTES__'
              cat "$NOTES_FILE"
              echo
              echo '__RELEASE_NOTES__'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Retry wrapper for GitHub API 5xx errors
          gh_retry() {
            local max_retries=5
            local delay=30
            local attempt=1
            while [ "$attempt" -le "$max_retries" ]; do
              if "$@"; then
                return 0
              fi
              local rc=$?
              if [ "$attempt" -eq "$max_retries" ]; then
                echo "::error::Command failed after $max_retries attempts: $*"
                return $rc
              fi
              echo "::warning::Attempt $attempt/$max_retries failed (exit $rc), retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          gh_retry gh release edit "${GITHUB_REF_NAME}" --draft=false --notes "${{ steps.release_notes.outputs.body }}"
          echo "Release published with release notes."
