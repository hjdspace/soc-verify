appId: com.socverify.app
productName: SoC Verify
compression: normal
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
afterPack: ./scripts/electron-builder-afterpack.cjs
# 只保留中英文 Chromium 语言包，裁剪 locales/*.pak（约 -40MB）
electronLanguages:
  - zh-CN
  - en-US
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - build/icons/**/*
extraResources:
  - from: plugins
    to: plugins
    filter: ["**/*"]
  # pi runner 脚本（普通 Node 脚本，ELECTRON_RUN_AS_NODE=1 运行）——
  # issue 10：以源码 .ts 形式分发，运行时由 Node 原生 type-stripping 加载
  - from: runner-pi
    to: runner-pi
    filter: ["**/*.ts", "!**/*.test.ts"]
  # pi runner 生产依赖（prepare-runner-deps 以 npm ci --omit=dev --ignore-scripts
  # 安装的精确 lockfile 载荷）。放在 runner-pi/ 下，Node 从脚本所在目录
  # 向上解析 node_modules 时直接命中。
  - from: resources/runner-deps/node_modules
    to: runner-pi/node_modules
    filter: ["**/*"]
  - from: resources/terminal
    to: terminal
    filter: ["**/*"]
  - from: resources/binaries
    to: binaries
    # 排除 officecli 自更新中断残留的 .update.partial 临时文件（非有效载荷）
    filter: ["**/*", "!README.md", "!**/*.update.partial"]
  - from: resources/fonts
    to: fonts
    # Nerd Font 字体文件（download:nerd-fonts 下载），README 仅为目录占位说明
    filter: ["**/*", "!README.md"]
  - from: resources/built-in-extension
    to: built-in-extension
    filter: ["**/*"]
  - from: engine/traceweave
    to: traceweave
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/.pytest_cache/**"
      - "!**/.venv/**"
      - "!third_party/**"            # Synopsys 专有运行库不分发，运行时从用户 VERDI_HOME 加载
      - "!tests/**"
      - "!docs/**"
      - "!reference/**"
      - "!benchmarks/**"
      - "!assets/**"
      - "!scripts/**"
      - "!*.md"
      - "!pytest.ini"
      # libfsdb_wrapper.so（构建机预编译产物）与 fsdb_wrapper.cpp/build_wrapper.sh
      # 随包分发：前者供 FSDB 解析，后者作为用户机（有 VERDI_HOME）自行重编译的兜底
asarUnpack:
  - resources/binaries/**
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
  - '**/*.node'
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns
linux:
  target:
    - AppImage
  category: Development
  icon: build/icons/
