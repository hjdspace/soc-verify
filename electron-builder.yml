appId: com.socverify.app
productName: SoC Verify
compression: normal
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
afterPack: ./scripts/electron-builder-afterpack.cjs
# 只保留中英文 Chromium 语言包，裁剪 locales/*.pak（约 -40MB）
electronLanguages:
  - zh-CN
  - en-US
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - build/icons/**/*
  # @lancedb/lancedb 的 optionalDependencies 带一整套「自带向量化」依赖
  # （@huggingface/transformers + onnxruntime-node/web + openai，实测未压缩约 337MB）。
  # 本项目 embedding 走用户配置的端点、从不 import lancedb/embedding/*，
  # 全项目也搜不到这四者的任何 import，属纯死重，必须排除以控制安装包体积
  # （ADR 0034 §6）。带 `**/` 前缀是为了同时命中顶层与被 npm 嵌套安装的副本
  # （实测 @lancedb/lancedb/node_modules/openai 也会出现）。
  # 注意：不能改用全局 --omit=optional —— 本项目自身的 optionalDependencies
  # 里的 @rollup/rollup-win32-x64-msvc、lightningcss-win32-x64-msvc 是构建必需。
  - '!**/@huggingface/transformers/**'
  - '!**/onnxruntime-node/**'
  - '!**/onnxruntime-web/**'
  - '!**/openai/**'
extraResources:
  - from: plugins
    to: plugins
    filter: ["**/*"]
  # pi runner 脚本（普通 Node 脚本，ELECTRON_RUN_AS_NODE=1 运行）——
  # issue 10：以源码 .ts 形式分发，运行时由 Node 原生 type-stripping 加载
  - from: runner-pi
    to: runner-pi
    filter: ["**/*.ts", "!**/*.test.ts"]
  # pi runner 生产依赖（prepare-runner-deps 以 npm ci --omit=dev --ignore-scripts
  # 安装的精确 lockfile 载荷）。放在 runner-pi/ 下，Node 从脚本所在目录
  # 向上解析 node_modules 时直接命中。
  - from: resources/runner-deps/node_modules
    to: runner-pi/node_modules
    filter: ["**/*"]
  - from: resources/terminal
    to: terminal
    filter: ["**/*"]
  # pdfjs 本地运行时（issue 11）：legacy ESM build + standard_fonts/cmaps/wasm
  # + @napi-rs/canvas（pdf.mjs 的 createRequire 解析基座）。
  # 由 npm run prepare:pdfjs 物化；运行时 resolvePdfRuntimePaths 读取
  # <resourcesPath>/pdfjs，只使用本地资源（无 CDN）。
  - from: resources/pdfjs
    to: pdfjs
    filter: ["**/*"]
  - from: resources/binaries
    to: binaries
    # 排除 officecli 自更新残留：.update.partial 为下载中断的临时文件，
    # .old 为 CLI 自更新时备份的旧版本二进制（~32MB，gitignore 但本地磁盘残留）
    filter: ["**/*", "!README.md", "!**/*.update.partial", "!**/*.old"]
  - from: resources/fonts
    to: fonts
    # Nerd Font 字体文件（download:nerd-fonts 下载），README 仅为目录占位说明
    filter: ["**/*", "!README.md"]
  - from: resources/built-in-extension
    to: built-in-extension
    filter: ["**/*"]
  - from: engine/traceweave
    to: traceweave
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/.pytest_cache/**"
      - "!**/.venv/**"
      - "!third_party/**"            # Synopsys 专有运行库不分发，运行时从用户 VERDI_HOME 加载
      - "!tests/**"
      - "!docs/**"
      - "!reference/**"
      - "!benchmarks/**"
      - "!assets/**"
      - "!scripts/**"
      - "!*.md"
      - "!pytest.ini"
      # libfsdb_wrapper.so（构建机预编译产物）与 fsdb_wrapper.cpp/build_wrapper.sh
      # 随包分发：前者供 FSDB 解析，后者作为用户机（有 VERDI_HOME）自行重编译的兜底
asarUnpack:
  - resources/binaries/**
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
  - '**/*.node'
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns
linux:
  target:
    - AppImage
  category: Development
  icon: build/icons/
