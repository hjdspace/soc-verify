<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Composer 弹层预览 — 对齐 beautiful-ui Prompt Bar</title>
<style>
  /* token 取自 src/renderer/src/styles/ai-panel.css :root（亮色） */
  :root {
    --dsw-layer-1: rgb(255, 255, 255);
    --dsw-layer-3: rgb(245, 246, 247);
    --dsw-label-primary: rgb(15, 17, 21);
    --dsw-label-secondary: rgb(97, 102, 107);
    --dsw-label-tertiary: rgb(129, 133, 140);
    --dsw-border-l1: rgba(0, 0, 0, 0.04);
    --dsw-border-l2: rgba(0, 0, 0, 0.1);
    --dsw-blue: rgb(65, 118, 230);
    --dsw-hover-solid: rgb(241, 243, 245);
    --dsw-hover-bg: rgba(38, 49, 72, 0.06);
    --dsw-input-major: rgb(255, 255, 255);
    --dsw-shadow-lv3: 0 0 1px 0 rgba(0, 0, 0, 0.2), 0 0 4px 0 rgba(0, 0, 0, 0.02),
      0 12px 32px 0 rgba(0, 0, 0, 0.08);
    --ap-menu-bg: var(--dsw-layer-1);
    --ap-menu-highlight: var(--dsw-hover-solid);
  }
  body {
    margin: 0;
    background: rgb(245, 246, 247);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    gap: 220px;
    align-items: center;
    padding: 60px 0 160px;
  }

  /* ↓↓↓ 与 ai-panel.css 中 .ap-menu 体系逐字一致 ↓↓↓ */
  .ap-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    z-index: 50;
    background: var(--ap-menu-bg);
    border: 1px solid var(--dsw-border-l2);
    border-radius: 10px;
    box-shadow: var(--dsw-shadow-lv3);
    padding: 4px;
    transform-origin: bottom center;
  }
  .ap-menu-list { position: relative; overflow-y: auto; overscroll-behavior: contain; }
  .ap-menu-highlight {
    position: absolute; left: 0; right: 0;
    border-radius: 6px;
    background: var(--ap-menu-highlight);
    opacity: 0; pointer-events: none;
  }
  .ap-menu-row {
    position: relative; z-index: 1;
    display: flex; width: 100%; height: 36px;
    align-items: center; gap: 10px;
    border-radius: 6px; padding: 0 8px;
    text-align: left;
    border: none; background: none; font: inherit; cursor: pointer;
  }
  .ap-menu-row-icon {
    display: flex; width: 22px; height: 22px; flex-shrink: 0;
    align-items: center; justify-content: center;
    color: var(--dsw-label-secondary);
  }
  .ap-menu-row-title { flex-shrink: 0; font-size: 12.5px; line-height: 18px; font-weight: 500; color: var(--dsw-label-primary); }
  .ap-menu-row-desc { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; line-height: 18px; color: var(--dsw-label-tertiary); }
  .ap-menu-row-tag { flex-shrink: 0; font-size: 11px; color: var(--dsw-label-tertiary); }
  .ap-menu-note { margin-top: 4px; border-top: 1px solid var(--dsw-border-l1); padding: 6px 8px 4px; font-size: 11px; color: var(--dsw-label-tertiary); }
  .ap-menu-empty { display: flex; height: 36px; align-items: center; padding: 0 8px; font-size: 12px; color: var(--dsw-label-tertiary); }
  /* ↑↑↑ 与 ai-panel.css 一致 ↑↑↑ */

  .anchor { position: relative; width: 560px; }
  .composer {
    display: flex; flex-direction: column; gap: 6px;
    border: 1px solid var(--dsw-border-l2); border-radius: 16px;
    background: var(--dsw-input-major); padding: 8px;
    box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.02), 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  }
  .composer .draft { min-height: 40px; padding: 4px 2px; font-size: 12px; color: var(--dsw-label-primary); }
  .composer .controls { display: flex; align-items: center; justify-content: space-between; }
  .composer .left, .composer .right { display: flex; align-items: center; gap: 4px; }
  .knob {
    height: 24px; border: none; border-radius: 999px; padding: 0 8px;
    background: var(--dsw-layer-3); color: var(--dsw-label-secondary); font-size: 10px; cursor: pointer;
  }
  .knob.round { width: 24px; padding: 0; }
  .send { width: 28px; height: 28px; border: none; border-radius: 999px; background: var(--dsw-blue); color: #fff; cursor: pointer; }
  .check { flex-shrink: 0; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; color: var(--dsw-blue); }
  .hl-demo .ap-menu-highlight { opacity: 1; }
  h2 { font-size: 12px; color: var(--dsw-label-tertiary); font-weight: 500; margin: 0 0 150px; }
  svg { display: block; }
</style>
</head>
<body>

<h2>1 · @ 文件菜单（输入以搜索文件）— 第 2 行悬停滑动高亮</h2>
<div class="anchor hl-demo">
  <div class="ap-menu" style="left: 0; right: 0;">
    <div class="ap-menu-list" style="max-height: 256px;">
      <span class="ap-menu-highlight" style="top: 40px; height: 36px;"></span>
      <button class="ap-menu-row">
        <span class="ap-menu-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
        <span class="ap-menu-row-title">package.json</span>
        <span class="ap-menu-row-desc">.\package.json</span>
      </button>
      <button class="ap-menu-row">
        <span class="ap-menu-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
        <span class="ap-menu-row-title">src</span>
        <span class="ap-menu-row-desc">.\src</span>
      </button>
      <button class="ap-menu-row">
        <span class="ap-menu-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
        <span class="ap-menu-row-title">sim-artifact-resolver.ts</span>
        <span class="ap-menu-row-desc">.\src\main\simulation\sim-artifact-resolver.ts</span>
      </button>
      <button class="ap-menu-row">
        <span class="ap-menu-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
        <span class="ap-menu-row-title">host-tools.ts</span>
        <span class="ap-menu-row-desc">.\src\main\omp\host-tools.ts</span>
      </button>
    </div>
    <div class="ap-menu-note">输入以搜索文件</div>
  </div>
  <div class="composer">
    <div class="draft">@si</div>
    <div class="controls">
      <div class="left"><button class="knob round">+</button><button class="knob">信任</button><button class="knob">默认</button><button class="knob">GLM-5.3 ⌄</button></div>
      <div class="right"><button class="send">↑</button></div>
    </div>
  </div>
</div>

<h2>2 · / 技能菜单（输入以搜索技能）— 无交互时保持素净</h2>
<div class="anchor">
  <div class="ap-menu" style="left: 0; right: 0;">
    <div class="ap-menu-list" style="max-height: 256px;">
      <span class="ap-menu-highlight"></span>
      <button class="ap-menu-row">
        <span class="ap-menu-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg></span>
        <span class="ap-menu-row-title">run-simulation</span>
        <span class="ap-menu-row-desc">编译并运行指定用例的仿真</span>
        <span class="ap-menu-row-tag">builtin</span>
      </button>
      <button class="ap-menu-row">
        <span class="ap-menu-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg></span>
        <span class="ap-menu-row-title">check-coverage</span>
        <span class="ap-menu-row-desc">分析覆盖率数据库并生成报告</span>
        <span class="ap-menu-row-tag">builtin</span>
      </button>
      <button class="ap-menu-row">
        <span class="ap-menu-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg></span>
        <span class="ap-menu-row-title">review-fail-log</span>
        <span class="ap-menu-row-desc">定位失败用例的日志根因</span>
        <span class="ap-menu-row-tag">project</span>
      </button>
    </div>
    <div class="ap-menu-note">输入以搜索技能</div>
  </div>
  <div class="composer">
    <div class="draft">/cov</div>
    <div class="controls">
      <div class="left"><button class="knob round">+</button><button class="knob">信任</button><button class="knob">默认</button><button class="knob">GLM-5.3 ⌄</button></div>
      <div class="right"><button class="send">↑</button></div>
    </div>
  </div>
</div>

<h2>3 · 附件 / 权限菜单（+ 按钮，左下锚定，勾选列标记当前项）</h2>
<div style="display: flex; gap: 120px;">
  <div class="anchor" style="width: 224px;">
    <div class="ap-menu" style="left: 0; width: 224px; transform-origin: bottom left;">
      <div class="ap-menu-list" style="max-height: 256px;">
        <span class="ap-menu-highlight"></span>
        <button class="ap-menu-row">
          <span class="ap-menu-row-icon">🖼</span>
          <span class="ap-menu-row-title">添加图片</span>
          <span class="ap-menu-row-desc">从本地选择图片</span>
        </button>
        <button class="ap-menu-row">
          <span class="ap-menu-row-icon">📄</span>
          <span class="ap-menu-row-title">附加文件</span>
          <span class="ap-menu-row-desc">选择项目内文件</span>
        </button>
        <button class="ap-menu-row">
          <span class="ap-menu-row-icon">📁</span>
          <span class="ap-menu-row-title">添加文件夹</span>
          <span class="ap-menu-row-desc">作为上下文引用</span>
        </button>
      </div>
    </div>
    <div class="composer"><div class="controls"><div class="left"><button class="knob round">+</button></div></div></div>
  </div>

  <div class="anchor" style="width: 256px;">
    <div class="ap-menu" style="left: 0; width: 256px; transform-origin: bottom left;">
      <div class="ap-menu-list" style="max-height: 256px;">
        <span class="ap-menu-highlight"></span>
        <button class="ap-menu-row">
          <span class="ap-menu-row-icon">🛡</span>
          <span class="ap-menu-row-title">总询问</span>
          <span class="ap-menu-row-desc">写入和执行均需确认</span>
          <span class="check"></span>
        </button>
        <button class="ap-menu-row">
          <span class="ap-menu-row-icon">🛡</span>
          <span class="ap-menu-row-title">自动编辑</span>
          <span class="ap-menu-row-desc">仅执行命令需确认</span>
          <span class="check"></span>
        </button>
        <button class="ap-menu-row">
          <span class="ap-menu-row-icon">🛡</span>
          <span class="ap-menu-row-title">完全信任</span>
          <span class="ap-menu-row-desc">自动批准所有操作</span>
          <span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
      </div>
      <div class="ap-menu-note">模型不支持思考时设置不生效</div>
    </div>
    <div class="composer"><div class="controls"><div class="left"><button class="knob">信任</button></div></div></div>
  </div>
</div>

</body>
</html>
