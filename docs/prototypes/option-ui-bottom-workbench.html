<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option · Bottom Workbench</title><style>body{background:oklch(16% .012 185) !important}</style>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:oklch(16% .012 185);color:oklch(92% .01 185);--line:oklch(31% .018 185);--muted:oklch(67% .018 185);--accent:oklch(72% .13 165);--surface:oklch(21% .015 185)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(oklch(16% .012 185),oklch(19% .014 185))}.workbench{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(780px,94vw);height:min(430px,78vh);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;background:var(--surface);box-shadow:0 18px 55px oklch(6% .01 185 / .6)}header{height:42px;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 14px;gap:14px}.title{font-size:12px;font-weight:700}.context{font-size:10px;color:var(--muted)}.grow{flex:1}.button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:5px;padding:6px 9px;font-size:11px}.primary{background:var(--accent);border-color:var(--accent);color:oklch(19% .03 165);font-weight:700}.body{display:flex;min-height:0;flex:1}.rail{width:154px;padding:12px 9px;border-right:1px solid var(--line)}.rail button{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:5px;text-align:left;font-size:11px}.rail button.active{background:oklch(29% .02 185);color:oklch(92% .01 185)}.content{flex:1;overflow:auto;padding:16px 20px}.group{display:none}.group.active{display:block}.group h2{margin:0 0 14px;font-size:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px 18px}.field{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}label{font-size:11px;color:var(--muted)}input,select{background:oklch(17% .012 185);color:inherit;border:1px solid var(--line);border-radius:5px;padding:8px;font-size:12px;outline:none}input:focus,select:focus{border-color:var(--accent)}footer{height:44px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px}.cmd{font:10px ui-monospace,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
</style></head><body><section class="workbench"><header><span class="title">仿真 Option</span><span class="context">CPU_SYS / smoke_boot</span><span class="grow"></span><button class="button">预设</button><button class="button">收起</button></header><div class="body"><nav class="rail"><button class="active" data-target="basic">基础参数 <span>3</span></button><button data-target="wave">波形配置 <span>4</span></button><button data-target="sim">仿真参数 <span>3</span></button><button data-target="reg">回归测试 <span>5</span></button></nav><main class="content"><section id="basic" class="group active"><h2>基础参数</h2><div class="fields"><div class="field"><label>BASE</label><input value="top"></div><div class="field"><label>BLOCK</label><input value="apcpu_sys"></div><div class="field wide"><label>CASE</label><input value="smoke_boot"></div></div></section><section id="wave" class="group"><h2>波形配置</h2><div class="fields"><div class="field"><label>Dump level</label><select><option>all</option><option>signal</option></select></div><div class="field"><label>波形目录</label><input value="./waves"></div></div></section><section id="sim" class="group"><h2>仿真参数</h2><div class="fields"><div class="field"><label>Seed</label><input value="42" type="number"></div><div class="field"><label>Extra args</label><input placeholder="+define+SMOKE"></div></div></section><section id="reg" class="group"><h2>回归测试</h2><div class="fields"><div class="field"><label>TAG</label><input placeholder="nightly"></div></div></section></main></div><footer><span class="cmd">runsim -base top -block apcpu_sys -case smoke_boot</span><button class="button">检查命令</button><button class="button primary">运行仿真</button></footer></section><script>document.querySelectorAll('.rail button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rail button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.group').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.target).classList.add('active')})</script></body></html>
