<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option · Slim Drawer</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:oklch(16% .012 185);color:oklch(92% .01 185);--line:oklch(31% .018 185);--muted:oklch(68% .018 185);--accent:oklch(72% .13 165);--surface:oklch(22% .016 185)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:oklch(16% .012 185)}.drawer{position:fixed;right:18px;bottom:18px;width:min(390px,calc(100vw - 36px));max-height:calc(100vh - 36px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 18px 50px oklch(7% .01 185 / .6)}header{padding:14px 16px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:16px;margin:3px 0 0}.icon{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}.context{padding:9px 16px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.body{overflow:auto;padding:13px 16px 18px}.group{margin-bottom:18px}.group h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field.wide{grid-column:1/-1}label{font-size:11px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:5px;background:oklch(18% .012 185);color:inherit;padding:7px 8px;font:inherit;font-size:12px;outline:none}input:focus,select:focus{border-color:var(--accent)}.toggle{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:5px;padding:7px 8px;font-size:11px}.switch{width:28px;height:16px;border:0;border-radius:99px;background:oklch(39% .02 185);padding:2px;cursor:pointer}.switch i{display:block;width:12px;height:12px;border-radius:50%;background:oklch(88% .01 185);transition:transform .18s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(12px)}footer{border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:8px;align-items:center}.footer-spacer{flex:1}.button{border:1px solid var(--line);border-radius:5px;background:transparent;color:inherit;padding:7px 10px;font-size:11px;cursor:pointer}.button.primary{background:var(--accent);border-color:var(--accent);color:oklch(19% .03 165);font-weight:700}.preview{font:11px ui-monospace,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><section class="drawer"><header><div><div class="eyebrow">Simulation options</div><h1>运行配置</h1></div><button class="icon" title="关闭">×</button></header><div class="context"><span>CPU_SYS / case_042</span><span>18 fields</span></div><div class="body"><section class="group"><h2>基础参数</h2><div class="fields"><div class="field"><label>BASE</label><input value="top"></div><div class="field"><label>BLOCK</label><input value="apcpu_sys"></div><div class="field wide"><label>CASE</label><input value="smoke_boot"></div></div></section><section class="group"><h2>波形配置</h2><div class="fields"><div class="toggle"><span>FSDB</span><button class="switch on"><i></i></button></div><div class="toggle"><span>覆盖率</span><button class="switch"><i></i></button></div><div class="field"><label>Dump level</label><select><option>all</option><option>signal</option><option>none</option></select></div><div class="field"><label>Seed</label><input value="42" type="number"></div></div></section><section class="group"><h2>执行模式</h2><div class="fields"><div class="toggle"><span>仅编译</span><button class="switch"><i></i></button></div><div class="toggle"><span>仅仿真</span><button class="switch on"><i></i></button></div></div></section></div><footer><span class="preview">runsim -base top -block apcpu_sys ...</span><span class="footer-spacer"></span><button class="button">预设</button><button class="button primary">运行</button></footer></section><script>document.querySelectorAll('.switch').forEach(b=>b.onclick=()=>b.classList.toggle('on'))</script></body></html>
