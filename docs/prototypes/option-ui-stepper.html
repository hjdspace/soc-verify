<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option · Stepper</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:oklch(16% .012 185);color:oklch(92% .01 185);--line:oklch(31% .018 185);--muted:oklch(67% .018 185);--accent:oklch(72% .13 165);--surface:oklch(22% .015 185)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:oklch(16% .012 185)}.sheet{width:min(480px,92vw);min-height:570px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 20px 60px oklch(6% .01 185 / .6)}header{padding:18px 22px 14px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:start}.kicker{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}h1{font-size:18px;margin:5px 0}.sub{font-size:11px;color:var(--muted)}.steps{display:flex;gap:5px;margin-top:17px}.step{height:4px;flex:1;background:oklch(34% .018 185);border-radius:99px}.step.active{background:var(--accent)}main{flex:1;padding:20px 22px}.stage{display:none}.stage.active{display:block}.stage h2{font-size:15px;margin:0 0 4px}.stage p{font-size:11px;color:var(--muted);margin:0 0 18px}.field{margin:13px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}input,select{width:100%;background:oklch(17% .012 185);color:inherit;border:1px solid var(--line);border-radius:5px;padding:9px;font-size:12px;outline:none}input:focus,select:focus{border-color:var(--accent)}.check{display:flex;align-items:center;gap:9px;font-size:12px;margin:14px 0}.check input{width:auto;accent-color:var(--accent)}.review{border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--muted);line-height:1.8}.review b{color:oklch(89% .01 185);font-weight:500}footer{border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:8px}.grow{flex:1}.button{border:1px solid var(--line);border-radius:5px;background:transparent;color:inherit;padding:8px 12px;font-size:11px}.primary{background:var(--accent);border-color:var(--accent);color:oklch(19% .03 165);font-weight:700}
</style></head><body><section class="sheet"><header><div class="top"><div><div class="kicker">Run setup · 2 / 3</div><h1>选择仿真参数</h1><div class="sub">CPU_SYS / smoke_boot</div></div><button class="button">×</button></div><div class="steps"><i class="step active"></i><i class="step active"></i><i class="step"></i></div></header><main><section class="stage active" data-stage="0"><h2>基础参数</h2><p>确定本次仿真要运行的编译上下文。</p><div class="field"><label>BASE</label><input value="top"></div><div class="field"><label>BLOCK</label><input value="apcpu_sys"></div><div class="field"><label>CASE</label><input value="smoke_boot"></div></section><section class="stage" data-stage="1"><h2>执行设置</h2><p>选择波形、seed 和执行模式。</p><label class="check"><input type="checkbox" checked> 生成 FSDB 波形</label><label class="check"><input type="checkbox"> 提交覆盖率</label><div class="field"><label>Seed</label><input value="42" type="number"></div></section><section class="stage" data-stage="2"><h2>确认命令</h2><p>确认无误后启动仿真。</p><div class="review"><div>BASE <b>top</b></div><div>BLOCK <b>apcpu_sys</b></div><div>CASE <b>smoke_boot</b></div><div>SEED <b>42</b></div></div></section></main><footer><button id="back" class="button">上一步</button><span class="grow"></span><button id="next" class="button primary">下一步</button></footer></section><script>let stage=0;const stages=[...document.querySelectorAll('.stage')],bars=[...document.querySelectorAll('.step')];function render(){stages.forEach((x,i)=>x.classList.toggle('active',i===stage));bars.forEach((x,i)=>x.classList.toggle('active',i<=stage));document.querySelector('#back').disabled=stage===0;document.querySelector('#next').textContent=stage===2?'运行仿真':'下一步'}document.querySelector('#back').onclick=()=>{stage=Math.max(0,stage-1);render()};document.querySelector('#next').onclick=()=>{stage=Math.min(2,stage+1);render()};render()</script></body></html>
