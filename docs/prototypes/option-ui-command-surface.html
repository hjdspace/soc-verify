<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option · Command Surface</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:oklch(16% .012 185);color:oklch(92% .01 185);--line:oklch(31% .018 185);--muted:oklch(68% .018 185);--accent:oklch(72% .13 165);--surface:oklch(22% .015 185)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:oklch(16% .012 185)}.surface{width:min(570px,92vw);max-height:84vh;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 22px 60px oklch(5% .01 185 / .62)}header{padding:15px 18px 13px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center}.label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}h1{font-size:17px;margin:4px 0}.context{font-size:11px;color:var(--muted)}.mode{display:flex;margin-top:14px;border:1px solid var(--line);border-radius:6px;padding:2px}.mode button{flex:1;border:0;background:transparent;color:var(--muted);padding:6px;font-size:11px;border-radius:4px}.mode button.active{background:oklch(31% .03 185);color:var(--accent)}main{padding:16px 18px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}.field{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}label{font-size:11px;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:5px;background:oklch(17% .012 185);color:inherit;padding:8px;font-size:12px;outline:none}input:focus,select:focus{border-color:var(--accent)}.section{grid-column:1/-1;padding-top:4px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.section strong{font-size:11px}.section span{font-size:10px;color:var(--muted)}.check{display:flex;align-items:center;gap:8px;font-size:11px}.check input{accent-color:var(--accent)}footer{border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:10px}.cmd{font:11px ui-monospace,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:5px;padding:8px 12px;font-size:11px}.primary{background:var(--accent);border-color:var(--accent);color:oklch(19% .03 165);font-weight:700}
</style></head><body><section class="surface"><header><div class="top"><div><div class="label">Run command</div><h1>配置并运行</h1><div class="context">CPU_SYS · case_042 · preset: smoke</div></div><button class="button">×</button></div><div class="mode"><button class="active">单次仿真</button><button>仅编译</button><button>回归</button></div></header><main><div class="grid"><div class="section"><strong>基础参数</strong><span>3 项</span></div><div class="field"><label>BASE</label><input value="top"></div><div class="field"><label>BLOCK</label><input value="apcpu_sys"></div><div class="field wide"><label>CASE</label><input value="smoke_boot"></div><div class="section"><strong>执行参数</strong><span>快速检查</span></div><div class="field"><label>Seed</label><input type="number" value="42"></div><div class="field"><label>Dump level</label><select><option>all</option><option>signal</option></select></div><label class="check wide"><input type="checkbox" checked> 生成 FSDB 波形</label><label class="check wide"><input type="checkbox"> 提交覆盖率</label></div></main><footer><span class="cmd">runsim -base top -block apcpu_sys -case smoke_boot -seed 42</span><button class="button">保存预设</button><button class="button primary">运行</button></footer></section></body></html>
