<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 1 · Tabbed Compact · 仿真选项面板</title>
<style>
:root {
  --bg: #1a1b26;
  --bg-elevated: #24283b;
  --bg-hover: #2e3248;
  --fg: #c0caf5;
  --fg-dim: #565f89;
  --fg-bright: #7aa2f7;
  --border: #2a2e42;
  --border-bright: #3b4058;
  --primary: #7aa2f7;
  --primary-dim: #4c5a8a;
  --accent: #bb9af7;
  --green: #9ece6a;
  --red: #f7768e;
  --yellow: #e0af68;
  --radius: 6px;
  --mono: 'Cascadia Code', 'SF Mono', 'Fira Code', Consolas, monospace;
  --sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--fg);
  font-size: 13px;
  padding: 16px;
  min-height: 100vh;
}
.dock {
  max-width: 960px;
  margin: 0 auto;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
/* ── Header ─────────────────────────────────── */
.dock-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: linear-gradient(180deg, var(--bg-elevated), #1f2336);
  border-bottom: 1px solid var(--border);
}
.dock-header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dock-header-left .icon {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--primary);
}
.dock-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg);
}
.dock-badge {
  background: var(--primary-dim);
  color: var(--fg-bright);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
}
.dock-header-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.preset-btn, .save-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  font-size: 11px;
  color: var(--fg-dim);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: all .15s;
}
.preset-btn:hover, .save-btn:hover {
  background: var(--bg-hover);
  color: var(--fg);
  border-color: var(--border-bright);
}
.preset-input {
  width: 90px;
  padding: 3px 6px;
  font-size: 11px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--fg);
  outline: none;
}
.preset-input:focus { border-color: var(--primary); }

/* ── Tabs ─────────────────────────────────── */
.tabs-bar {
  display: flex;
  gap: 2px;
  padding: 0 10px;
  background: #1f2336;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 500;
  color: var(--fg-dim);
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.tab:hover { color: var(--fg); }
.tab.active {
  color: var(--fg-bright);
  border-bottom-color: var(--primary);
}
.tab .tab-count {
  font-size: 9px;
  color: var(--fg-dim);
  margin-left: 3px;
}
.tab.active .tab-count { color: var(--primary); }

/* ── Tab content ──────────────────────────── */
.tab-content {
  padding: 14px;
  max-height: 320px;
  overflow-y: auto;
}
.field-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px 14px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.field-label {
  font-size: 10px;
  font-weight: 500;
  color: var(--fg-dim);
  display: flex;
  align-items: center;
  gap: 3px;
}
.field-label .hint {
  color: var(--fg-dim);
  opacity: 0.5;
  cursor: help;
  font-size: 10px;
}
.field-input, .field-select {
  padding: 4px 8px;
  font-size: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--fg);
  outline: none;
  transition: border-color .15s;
  font-family: var(--mono);
}
.field-input:focus, .field-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(122,162,247,.15);
}
.field-input::placeholder { color: var(--fg-dim); opacity: .6; }

/* Toggle switch */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 28px;
}
.toggle {
  position: relative;
  width: 32px; height: 16px;
  background: var(--border-bright);
  border-radius: 10px;
  cursor: pointer;
  transition: background .2s;
}
.toggle.on { background: var(--primary); }
.toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--fg);
  transition: transform .2s;
}
.toggle.on::after { transform: translateX(16px); }

/* ── Command preview bar ──────────────────── */
.cmd-bar {
  display: flex;
  align-items: stretch;
  border-top: 1px solid var(--border);
  background: #16161e;
}
.cmd-preview {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 8px 14px;
  gap: 2px;
}
.cmd-label {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-dim);
}
.cmd-text {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--green);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.5;
}
.cmd-text .flag { color: var(--fg-bright); }
.cmd-text .val { color: var(--accent); }
.run-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 24px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(135deg, var(--green), #7dc970);
  border: none;
  cursor: pointer;
  transition: filter .15s;
}
.run-btn:hover { filter: brightness(1.1); }
.run-btn:active { filter: brightness(0.95); }
.run-btn svg { width: 16px; height: 16px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); }

/* Section hint */
.empty-hint {
  padding: 20px;
  text-align: center;
  color: var(--fg-dim);
  font-size: 12px;
}
</style>
</head>
<body>

<div class="dock" id="dock">
  <!-- Header -->
  <div class="dock-header">
    <div class="dock-header-left">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </span>
      <span class="dock-title">仿真 Option</span>
      <span class="dock-badge">24</span>
    </div>
    <div class="dock-header-right">
      <button class="preset-btn" onclick="togglePresetMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        预设
      </button>
      <input class="preset-input" placeholder="预设名称" id="presetName">
      <button class="save-btn" onclick="savePreset()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-bar" id="tabsBar">
    <button class="tab active" data-group="basic">基础参数 <span class="tab-count">7</span></button>
    <button class="tab" data-group="wave">波形配置 <span class="tab-count">8</span></button>
    <button class="tab" data-group="sim">仿真参数 <span class="tab-count">3</span></button>
    <button class="tab" data-group="mode">执行模式 <span class="tab-count">2</span></button>
    <button class="tab" data-group="regr">回归测试 <span class="tab-count">6</span></button>
  </div>

  <!-- Tab content -->
  <div class="tab-content" id="tabContent">
    <!-- Fields rendered by JS -->
  </div>

  <!-- Command preview + Run -->
  <div class="cmd-bar">
    <div class="cmd-preview">
      <span class="cmd-label">命令预览</span>
      <span class="cmd-text" id="cmdPreview">runsim</span>
    </div>
    <button class="run-btn" onclick="runSim()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      运行仿真
    </button>
  </div>
</div>

<script>
// ── Field definitions (from unisoc-sim-option-schema plugin) ──
const GROUPS = {
  basic: { label: '基础参数', fields: [
    { key:'base', label:'BASE', type:'string', desc:'runsim -base 参数' },
    { key:'block', label:'BLOCK', type:'string', desc:'runsim -block 参数' },
    { key:'case', label:'CASE', type:'string', desc:'runsim -case 参数' },
    { key:'rundir', label:'工作目录 (-rundir)', type:'string', desc:'工作目录，支持 {case_name}' },
    { key:'bq', label:'提交服务器 (-bq)', type:'string', desc:'LSF/BQ 服务器名称' },
    { key:'seed', label:'种子号 (-seed)', type:'string', desc:'仿真随机种子号' },
    { key:'other_options', label:'其他选项', type:'string', desc:'追加到命令末尾' },
  ]},
  wave: { label: '波形配置', fields: [
    { key:'fsdb', label:'Dump FSDB (-fsdb)', type:'boolean' },
    { key:'vwdb', label:'Dump VWDB (-vwdb)', type:'boolean' },
    { key:'dump_level', label:'Dump 层级', type:'string' },
    { key:'cl', label:'Clean INCA_libs (-cl)', type:'boolean' },
    { key:'dump_sva', label:'Dump SVA (-dump_sva)', type:'boolean' },
    { key:'cov', label:'收集覆盖率 (-cov)', type:'boolean' },
    { key:'upf', label:'UPF 仿真 (-upf)', type:'boolean' },
    { key:'dump_mem', label:'Dump Memory (-dump_mem)', type:'string' },
    { key:'wdd', label:'波形起始时间 (-wdd)', type:'string' },
  ]},
  sim: { label: '仿真参数', fields: [
    { key:'simarg', label:'仿真参数 (-simarg)', type:'string' },
    { key:'cfg_def', label:'配置定义 (-cfg_def)', type:'string' },
    { key:'post', label:'后仿 (-post)', type:'enum', enumValues:['','sdf=fake','sdf=pg_fake','sdf=npg_f1_ssg','sdf=npg_f2_ssg','sdf=npg_f3_ssg','sdf=npg_f4_ssg','sdf=npg_f5_ssg','sdf=npg_f6_ssg','sdf=npg_f7_ssg','sdf=npg_f1_ffg','sdf=npg_f2_ffg','sdf=npg_f3_ffg','sdf=npg_f4_ffg','sdf=npg_f5_ffg','sdf=npg_f6_ffg','sdf=npg_f7_ffg','sdf=npg_f1_tt','sdf=npg_f2_tt'] },
  ]},
  mode: { label: '执行模式', fields: [
    { key:'sim_only', label:'仅仿真 (-R)', type:'boolean' },
    { key:'compile_only', label:'仅编译 (-C)', type:'boolean' },
  ]},
  regr: { label: '回归测试', fields: [
    { key:'regr_file', label:'回归列表 (-regr)', type:'string' },
    { key:'fm', label:'回归 FAIL (-fm)', type:'boolean' },
    { key:'regr_work', label:'回归路径 (-regr_work)', type:'string' },
    { key:'tag', label:'回归 TAG (-tag)', type:'string' },
    { key:'nt', label:'不回归 TAG (-nt)', type:'string' },
    { key:'dashboard', label:'Dashboard (-m)', type:'string' },
  ]},
};

// Current values
const values = {};
let currentGroup = 'basic';

// Initialize defaults
for (const g of Object.values(GROUPS)) {
  for (const f of g.fields) {
    values[f.key] = f.type === 'boolean' ? false : (f.type === 'enum' ? '' : '');
  }
}

// Set some demo values
values.base = 'top';
values.block = 'usvp';
values.case = 'basic_test_001';

// ── Render ──
function renderFields() {
  const container = document.getElementById('tabContent');
  const group = GROUPS[currentGroup];
  if (!group) { container.innerHTML = '<div class="empty-hint">无可用选项</div>'; return; }

  const grid = document.createElement('div');
  grid.className = 'field-grid';

  for (const field of group.fields) {
    const div = document.createElement('div');
    div.className = 'field';

    const label = document.createElement('div');
    label.className = 'field-label';
    label.innerHTML = field.label + (field.desc ? ' <span class="hint" title="' + field.desc + '">(?)</span>' : '');

    if (field.type === 'boolean') {
      div.className = 'field';
      const row = document.createElement('div');
      row.className = 'toggle-row';
      const toggle = document.createElement('div');
      toggle.className = 'toggle' + (values[field.key] ? ' on' : '');
      toggle.onclick = () => { values[field.key] = !values[field.key]; toggle.className = 'toggle' + (values[field.key] ? ' on' : ''); updateCmd(); };
      row.appendChild(label);
      row.appendChild(toggle);
      div.innerHTML = '';
      div.appendChild(row);
    } else if (field.type === 'enum') {
      const select = document.createElement('select');
      select.className = 'field-select';
      for (const v of field.enumValues) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v || '--';
        if (values[field.key] === v) opt.selected = true;
        select.appendChild(opt);
      }
      select.onchange = (e) => { values[field.key] = e.target.value; updateCmd(); };
      div.innerHTML = '';
      div.appendChild(label);
      div.appendChild(select);
    } else {
      const input = document.createElement('input');
      input.className = 'field-input';
      input.type = 'text';
      input.value = values[field.key] || '';
      input.oninput = (e) => { values[field.key] = e.target.value; updateCmd(); };
      div.innerHTML = '';
      div.appendChild(label);
      div.appendChild(input);
    }

    grid.appendChild(div);
  }

  container.innerHTML = '';
  container.appendChild(grid);
}

// ── Tabs ──
document.getElementById('tabsBar').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentGroup = tab.dataset.group;
  renderFields();
});

// ── Command preview ──
const FLAG_MAP = {
  base:'-base', block:'-block', case:'-case', rundir:'-rundir', bq:'-bq',
  seed:'-seed', other_options:'', fsdb:'-fsdb', vwdb:'-vwdb', dump_level:'',
  cl:'-cl', dump_sva:'-dump_sva', cov:'-cov', upf:'-upf', dump_mem:'-dump_mem',
  wdd:'-wdd', simarg:'-simarg', cfg_def:'-cfg_def', post:'-post',
  sim_only:'-R', compile_only:'-C', regr_file:'-regr', fm:'-fm',
  regr_work:'-regr_work', tag:'-tag', nt:'-nt', dashboard:'-m',
};

function updateCmd() {
  let parts = ['runsim'];
  for (const [key, val] of Object.entries(values)) {
    if (val === '' || val === false || val === undefined || val === null) continue;
    const flag = FLAG_MAP[key];
    if (flag === '') { parts.push(val); continue; }
    if (val === true) { parts.push(flag); continue; }
    parts.push(flag);
    parts.push(String(val));
  }
  const html = parts.map(p => {
    if (p.startsWith('-')) return '<span class="flag">' + p + '</span>';
    if (p === 'runsim') return '<span class="flag">' + p + '</span>';
    return '<span class="val">' + p + '</span>';
  }).join(' ');
  document.getElementById('cmdPreview').innerHTML = html;
}

function runSim() {
  alert('运行仿真：\n' + document.getElementById('cmdPreview').textContent);
}

function togglePresetMenu() {
  alert('打开预设菜单');
}
function savePreset() {
  const name = document.getElementById('presetName').value.trim();
  if (!name) return;
  alert('保存预设：' + name);
}

// Init
renderFields();
updateCmd();
</script>
</body>
</html>
