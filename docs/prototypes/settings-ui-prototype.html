<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置页面 UI 原型 — PROTOTYPE（三变体，?variant=A/B/C）</title>
<!--
  PROTOTYPE — 一次性原型，用于回答：设置页面的布局与样式应该是什么样？
  三个结构完全不同的变体，通过 URL ?variant=A/B/C 切换，底部悬浮条 / 方向键可循环切换。
  变体 A：左侧垂直导航（IDE 风格，宽弹窗）
  变体 B：双栏表单式（macOS 系统设置风格：分组侧栏 + 搜索 + 右侧 label/控制 分行）
  变体 C：单栏流式 + 置顶锚点导航（宽屏卡片流）
  参考现有实现: src/renderer/src/components/settings/SettingsPanel.tsx
-->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        bg: '#1a1b21', surface: '#212229', surface2: '#2a2b33',
        border: '#33343d', primary: '#7c8cf8', primaryfg: '#12131a',
        muted: '#8b8d99', fg: '#e4e5ec',
      }
    }
  }
}
</script>
<style>
  body { font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #3a3b45; border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .switch { position: relative; width: 32px; height: 18px; border-radius: 9px; background: #3a3b45; transition: background .15s; cursor: pointer; flex-shrink: 0; }
  .switch.on { background: #7c8cf8; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on::after { left: 16px; }
  select, input, textarea { outline: none; }
  select:focus, input:focus, textarea:focus { box-shadow: 0 0 0 1px #7c8cf8; }
  .fade-in { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>

<!-- ════════════════ 原型切换浮动条（仅原型，生产移除） ════════════════ -->
<div class="fixed bottom-4 left-1/2 z-50 flex -translate-x-1/2 items-center gap-2 rounded-full border border-white/10 bg-black/80 px-4 py-2 text-xs text-white shadow-xl backdrop-blur">
  <span class="text-white/50">原型切换</span>
  <button class="V-btn rounded-full px-3 py-1 font-medium hover:bg-white/10" data-v="A">A 左侧导航</button>
  <button class="V-btn rounded-full px-3 py-1 font-medium hover:bg-white/10" data-v="B">B 双栏表单</button>
  <button class="V-btn rounded-full px-3 py-1 font-medium hover:bg-white/10" data-v="C">C 单栏流式</button>
  <span class="text-white/30">←/→ 或 URL ?variant=</span>
</div>

<script>
// ══════════ 组件模板 ══════════
const inp = (w) => `<input class="${w||'w-64'} h-8 rounded-md border border-border bg-bg px-2.5 text-xs text-fg placeholder:text-muted/60" placeholder="…">`;
const sel = () => `<select class="h-8 rounded-md border border-border bg-bg px-2 text-xs text-fg"><option>Claude</option><option>GPT-4o</option><option>DeepSeek</option></select>`;
const btnP = (t) => `<button class="h-8 rounded-md bg-primary px-3 text-xs font-medium text-primaryfg hover:opacity-90">${t}</button>`;
const btnG = (t) => `<button class="h-8 rounded-md border border-border bg-surface2 px-3 text-xs text-muted hover:text-fg">${t}</button>`;
const btnD = (t) => `<button class="h-8 rounded-md border border-red-500/30 bg-red-500/10 px-3 text-xs text-red-400 hover:bg-red-500/20">${t}</button>`;
const tog = (on, cb) => `<div class="switch ${on?'on':''}" ${cb?`onclick="this.classList.toggle('on')"`:''}></div>`;

// A/B 变体的卡片区块
const card = (title, desc, body) => `
  <div class="rounded-lg border border-border bg-bg/50 p-4 mb-4">
    <div class="mb-3"><div class="text-xs font-semibold">${title}</div>${desc?`<div class="mt-0.5 text-[10px] text-muted">${desc}</div>`:''}</div>
    ${body}
  </div>`;

// B 变体的表单行（label 左 / 控制右）
const brow = (label, ctrl, hint) => `
  <div class="flex items-center justify-between gap-4 border-b border-border/60 py-2.5 last:border-0">
    <div class="min-w-0">
      <div class="text-xs text-fg">${label}</div>
      ${hint?`<div class="mt-0.5 text-[10px] text-muted">${hint}</div>`:''}
    </div>
    <div class="flex shrink-0 items-center gap-2">${ctrl}</div>
  </div>`;
const bgroup = (title, rows) => `
  <div class="mb-5">
    ${title?`<div class="mb-2 text-[10px] font-semibold uppercase tracking-wide text-muted/70">${title}</div>`:''}
    <div class="rounded-lg border border-border bg-bg/50 px-4">${rows}</div>
  </div>`;

// ══════════ Tab 内容 ══════════
const TABS = {
  model: { title: '模型配置' },
  kb: { title: '知识库' },
  prompt: { title: '系统提示词' },
  plugins: { title: '插件管理' },
  skills: { title: 'Skill 管理' },
  mcp: { title: 'MCP 配置' },
  appearance: { title: '外观' },
  tv: { title: '时序违例' },
};

const CONTENT = {
  model: () => ({
    A: card('默认模型', '选择对话与任务使用的模型', `
        <div class="flex items-center gap-3">${sel()}<span class="text-[10px] text-muted">上下文窗口 200k</span></div>`)
      + card('API 密钥', '按供应商配置，存储在本地', `
        <div class="space-y-2">${inp('w-full')} ${inp('w-full')}</div>`)
      + `<div class="flex justify-end gap-2">${btnG('测试连接')}${btnP('保存')}</div>`,
    B: bgroup('默认模型', brow('对话模型', sel(), '用于 Agent 对话与任务执行'))
      + bgroup('API 密钥', brow('Anthropic API Key', inp('w-72')) + brow('OpenAI API Key', inp('w-72'), '本地加密存储'))
      + `<div class="flex justify-end gap-2">${btnG('测试连接')}${btnP('保存')}</div>`,

// ══════════ 导航绑定（A/B 通用） ══════════
function bindNav(cls, contentId, renderFn) {
  const contentEl = document.getElementById(contentId);
  document.querySelectorAll('.' + cls).forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.' + cls).forEach(x => {
      x.classList.remove('bg-primary/15','text-primary','font-medium');
      x.classList.add('text-muted');
    });
    b.classList.add('bg-primary/15','text-primary','font-medium');
    b.classList.remove('text-muted');
    contentEl.innerHTML = renderFn(b.dataset.tab);
    contentEl.classList.remove('fade-in'); void contentEl.offsetWidth; contentEl.classList.add('fade-in');
  }));
}
bindNav('A-nav', 'A-content', t => (CONTENT[t] || CONTENT.model)().A);
bindNav('B-nav', 'B-content', t => (CONTENT[t] || CONTENT.model)().B);

// ══════════ 变体 C：流式渲染全部 Tab + 锚点跳转 ══════════
(function () {
  const c = document.getElementById('C-content');
  c.innerHTML = Object.keys(TABS).map(t => `
    <section id="C-sec-${t}" class="mb-8" data-sec="${t}">
      <div class="mb-3 flex items-center gap-2">
        <h3 class="text-xs font-semibold uppercase tracking-wide text-muted/80">${TABS[t].title}</h3>
        <div class="h-px flex-1 bg-border"></div>
      </div>
      ${(CONTENT[t] || CONTENT.model)().C}
    </section>`).join('');
  // 锚点 chips 高亮 + 平滑滚动
  const chips = document.querySelectorAll('.C-chip');
  chips.forEach(ch => ch.addEventListener('click', () => {
    chips.forEach(x => { x.className = 'C-chip shrink-0 rounded-full border border-border px-3 py-1 text-[11px] text-muted hover:text-fg'; });
    ch.className = 'C-chip shrink-0 rounded-full bg-primary px-3 py-1 text-[11px] font-medium text-primaryfg';
    document.getElementById('C-sec-' + ch.dataset.tab).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  // 滚动监听：当前可视 section 高亮对应 chip
  const secObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const tab = e.target.dataset.sec;
      chips.forEach(x => {
        if (x.dataset.tab === tab) x.click();
      });
    });
  }, { root: c, rootMargin: '-15% 0px -70% 0px' });
  document.querySelectorAll('[data-sec]').forEach(s => secObs.observe(s));
})();

// ══════════ 变体切换 ══════════
const VARIANTS = ['A', 'B', 'C'];
function showVariant(v) {
  if (!VARIANTS.includes(v)) v = 'A';
  VARIANTS.forEach(x => document.getElementById('variant-' + x).classList.add('hidden'));
  document.getElementById('variant-' + v).classList.remove('hidden');
  document.querySelectorAll('.V-btn').forEach(b => {
    b.classList.toggle('bg-white/15', b.dataset.v === v);
    b.classList.toggle('text-white/50', b.dataset.v !== v);
  });
  history.replaceState(null, '', '?variant=' + v);
}
document.querySelectorAll('.V-btn').forEach(b => b.addEventListener('click', () => showVariant(b.dataset.v)));
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const cur = new URLSearchParams(location.search).get('variant') || 'A';
  const i = VARIANTS.indexOf(cur);
  showVariant(VARIANTS[(i + (e.key === 'ArrowRight' ? 1 : VARIANTS.length - 1)) % VARIANTS.length]);
});

// 初始渲染
document.querySelector('.A-nav').click();
document.querySelector('.B-nav').click();
showVariant(new URLSearchParams(location.search).get('variant'));
</script>
