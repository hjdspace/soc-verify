<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulation Option UI Prototypes</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", system-ui, sans-serif; background: oklch(18% .012 185); color: oklch(92% .012 185); }
    body { margin: 0; min-height: 100vh; padding: 36px; box-sizing: border-box; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: .01em; }
    p { color: oklch(70% .018 185); margin: 0 0 26px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    a { display: block; padding: 16px; border: 1px solid oklch(31% .018 185); border-radius: 8px; color: inherit; text-decoration: none; background: oklch(21% .014 185); }
    a:hover { border-color: oklch(66% .12 165); background: oklch(24% .018 185); }
    strong { display: block; margin-bottom: 6px; font-size: 14px; }
    span { display: block; color: oklch(67% .02 185); font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>仿真 Option UI 原型</h1>
    <p>五种不同容器结构，点击进入独立 HTML 原型。每个原型都包含真实 schema 的代表字段、预设入口和命令预览。</p>
    <div class="grid">
      <a href="option-ui-slim-drawer.html"><strong>A · 窄侧抽屉</strong><span>右下角窄宽高面板，适合快速改少量选项。</span></a>
      <a href="option-ui-inspector.html"><strong>B · 高检视器</strong><span>右侧长面板，分组导航与持续上下文并存。</span></a>
      <a href="option-ui-command-surface.html"><strong>C · 命令面</strong><span>居中紧凑表单，聚焦一次仿真配置和命令确认。</span></a>
      <a href="option-ui-bottom-workbench.html"><strong>D · 底部工作台</strong><span>底部横向工作区，左侧分组、右侧字段，保留终端心智模型。</span></a>
      <a href="option-ui-stepper.html"><strong>E · 分步配置单</strong><span>分步配置与最终检查，适合字段很多且依赖关系明显的场景。</span></a>
    </div>
  </main>
</body>
</html>
