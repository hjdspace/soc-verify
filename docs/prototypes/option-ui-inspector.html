<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option · Inspector</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:oklch(17% .012 185);color:oklch(92% .01 185);--line:oklch(30% .018 185);--muted:oklch(67% .018 185);--accent:oklch(72% .13 165);--surface:oklch(21% .014 185)}*{box-sizing:border-box}body{margin:0;min-height:100vh}.panel{position:fixed;inset:0 0 0 auto;width:min(430px,100vw);display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface)}header{padding:18px 18px 13px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between}.kicker{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:18px;margin:4px 0}.sub{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:2px;margin-top:14px}.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 9px;font-size:11px;border-bottom:2px solid transparent;cursor:pointer}.tabs button.active{color:var(--accent);border-color:var(--accent)}main{display:flex;min-height:0;flex:1}.rail{width:116px;border-right:1px solid var(--line);padding:12px 8px}.rail button{display:block;width:100%;border:0;background:transparent;text-align:left;color:var(--muted);padding:8px;border-radius:5px;font-size:11px;cursor:pointer}.rail button.active,.rail button:hover{background:oklch(28% .02 185);color:oklch(92% .01 185)}.content{flex:1;overflow:auto;padding:16px}.section{display:none}.section.active{display:block}.section h2{font-size:13px;margin:0 0 13px}.field{margin-bottom:13px}.field label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}.hint{font-size:10px;color:oklch(54% .018 185)}input,select{width:100%;background:oklch(17% .012 185);border:1px solid var(--line);border-radius:5px;padding:8px;color:inherit;font-size:12px;outline:none}input:focus,select:focus{border-color:var(--accent)}.check{display:flex;align-items:center;gap:8px;font-size:12px}.check input{width:auto;accent-color:var(--accent)}footer{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px}.button{flex:1;border:1px solid var(--line);background:transparent;color:inherit;border-radius:5px;padding:8px;font-size:11px}.button.primary{background:var(--accent);border-color:var(--accent);color:oklch(19% .03 165);font-weight:700}
</style></head><body><section class="panel"><header><div class="row"><div><div class="kicker">Simulation inspector</div><h1>仿真选项</h1><div class="sub">CPU_SYS / smoke_boot</div></div><button class="button" style="flex:0 0 auto">×</button></div><div class="tabs"><button class="active">配置</button><button>预设</button><button>命令</button></div></header><main><nav class="rail"><button class="active" data-target="basic">基础</button><button data-target="wave">波形</button><button data-target="sim">仿真</button><button data-target="reg">回归</button></nav><div class="content"><section id="basic" class="section active"><h2>基础参数</h2><div class="field"><label>BASE <span>必填</span></label><input value="top"></div><div class="field"><label>BLOCK</label><input value="apcpu_sys"></div><div class="field"><label>CASE</label><input value="smoke_boot"></div></section><section id="wave" class="section"><h2>波形配置</h2><div class="field check"><input type="checkbox" checked><span>生成 FSDB 波形</span></div><div class="field"><label>Dump level</label><select><option>all</option><option>signal</option><option>none</option></select></div><div class="field"><label>波形目录</label><input value="./waves/smoke_boot"></div></section><section id="sim" class="section"><h2>仿真参数</h2><div class="field"><label>Seed</label><input type="number" value="42"></div><div class="field"><label>额外参数</label><input placeholder="+define+SMOKE"></div></section><section id="reg" class="section"><h2>回归测试</h2><div class="field check"><input type="checkbox"><span>提交 Dashboard</span></div><div class="field"><label>TAG</label><input placeholder="nightly"></div></section></div></main><footer><button class="button">保存预设</button><button class="button primary">运行仿真</button></footer></section><script>document.querySelectorAll('.rail button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rail button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.target).classList.add('active')})</script></body></html>
